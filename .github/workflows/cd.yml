name: Deploy to EC2

on:
  workflow_run:
    workflows: ['Docker Image CI']
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASTION_IP: ${{ secrets.EC2_HOST }}
      BACKEND_IP: ${{ secrets.BACKEND_HOST }}
    steps:
      - name: Setup SSH Keys and Config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
          
          # SSH config 파일 생성
          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${{ env.BASTION_IP }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no
          
          Host backend
            HostName ${{ env.BACKEND_IP }}
            User ubuntu
            IdentityFile ~/.ssh/bastion_key
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF

      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Validate secrets structure
        run: |
          if [ ! -d "src/main/resources/secrets" ]; then
            echo "Error: secrets submodule not found"
            exit 1
          fi
          if [ ! -f "src/main/resources/secrets/application-prod.yaml" ]; then
            echo "Error: production config not found"
            exit 1
          fi
          echo "Secrets validation passed"

      - name: Copy secrets to server with verification
        run: |
          scp -r src/main/resources/secrets backend:/home/ubuntu/
          ssh backend "
          if [ ! -d '/home/ubuntu/secrets' ]; then
            echo 'Error: Failed to copy secrets'
            exit 1
          fi
          echo 'Secrets copied successfully'
          "

      - name: Execute Deployment Commands on Backend
        run: |
          ssh backend "
          docker pull hwangjungseok/lingua-backend:latest;
          docker stop lingua-backend || true;
          docker rm lingua-backend || true;
          IMAGE_ID=\$(docker images -q hwangjungseok/lingua-backend:latest | head -n 1);
          docker image prune -f;
          if [ ! -z \"\$IMAGE_ID\" ]; then
            docker images -q | grep -v \$IMAGE_ID | xargs -r docker rmi;
          fi;
          docker run -d -p 8080:8080 \
            --env-file /home/ubuntu/.env \
            --security-opt=no-new-privileges:true \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/log \
            -e JAVA_TOOL_OPTIONS='-javaagent:/pinpoint-agent/pinpoint-bootstrap-2.5.4.jar \
              -Dpinpoint.agentId=${{ secrets.PINPOINT_AGENT_ID }} \
              -Dpinpoint.applicationName=${{ secrets.PINPOINT_APPLICATION_NAME }} \
              -Dpinpoint.profiler.transport.grpc.collector.ip=${{ secrets.PINPOINT_COLLECTOR_IP }} \
              -Dpinpoint.profiler.transport.grpc.agent.collector.port=${{ secrets.PINPOINT_AGENT_COLLECTOR_PORT }} \
              -Dpinpoint.profiler.transport.grpc.stat.collector.port=${{ secrets.PINPOINT_STAT_COLLECTOR_PORT }} \
              -Dpinpoint.profiler.transport.grpc.span.collector.port=${{ secrets.PINPOINT_SPAN_COLLECTOR_PORT }} \
              -Dpinpoint.profiler.transport.grpc.meta.collector.port=${{ secrets.PINPOINT_META_COLLECTOR_PORT }} \
              -Dpinpoint.profiler.sampling.counting.sampling-rate=1 \
              -Dpinpoint.profiler.uri.stat.enable=true \
              -Dpinpoint.profiler.uri.stat.spring.webmvc.enable=true \
              -Dpinpoint.profiler.uri.stat.collect.http.method=true \
              -Dpinpoint.profiler.uri.stat.record.path=true \
              -Dpinpoint.profiler.error.enable=true \
              -Dpinpoint.profiler.exception.trace=true' \
            -v \$(pwd)/pinpoint-agent-2.5.4:/pinpoint-agent \
            --restart always \
            --name lingua-backend \
            hwangjungseok/lingua-backend:latest"

      - name: Cleanup old images on server
        run: |
          ssh backend "
          # Keep only the 3 most recent images
          docker images hwangjungseok/lingua-backend --format 'table {{.Repository}}:{{.Tag}}\t{{.ID}}' | \
          tail -n +2 | head -n -3 | awk '{print \$2}' | xargs -r docker rmi
          echo 'Image cleanup completed'
          " || echo "Image cleanup failed but continuing"

      - name: Send deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="SUCCESS"
            COLOR="good"
          else
            STATUS="FAILED"
            COLOR="danger"
          fi
          
          echo "Deployment $STATUS for commit ${{ github.sha }}"