server:
  forward-headers-strategy: NATIVE

ncp:
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:dummy-access-key}
        secret-key: ${AWS_SECRET_KEY:dummy-secret-key}
      s3:
        bucket: ${S3_BUCKET_NAME:pdf-bucket01}
        endpoint: ${S3_ENDPOINT:https://s3.ap-northeast-2.amazonaws.com}
        region: ${AWS_REGION:ap-northeast-2}

queue:
  json-event-url: ${SQS_QUEUE_URL:dummy-queue-url}
  json-event-name: ${SQS_QUEUE_NAME:JsonEvent}

kanji:
  api:
    base-url: ${KANJI_API_BASE_URL}

spring:
  cloud:
    aws:
      sqs:
        enabled: ${SQS_ENABLED:true}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY:dummy-access-key}
        secret-key: ${AWS_SECRET_KEY:dummy-secret-key}