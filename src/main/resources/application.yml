spring:
  profiles:
    active: prod
  cloud:
    aws:
      sqs:
        enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lingua}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:

        dialect: org.hibernate.dialect.MySQL8Dialect

        default_batch_fetch_size: 100

        jdbc:
          batch_size: 50

        order_inserts: true
        order_updates: true

        format_sql: true
        highlight_sql: true
        use_sql_comments: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info

kanji:
  api:
    url: ${KANJI_API_URL:http://127.0.0.1:3000}