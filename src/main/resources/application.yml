spring:
  profiles:
    active: prod
  cloud:
    aws:
      sqs:
        enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lingua}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:default-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:default-google-secret}
            scope:
              - email
              - profile

          naver:
            client-id: ${NAVER_CLIENT_ID:default-naver-id}
            client-secret: ${NAVER_CLIENT_SECRET:default-naver-secret}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - name
              - email
              - profile_image

          kakao:
            client-id: ${KAKAO_CLIENT_ID:default-kakao-id}
            client-secret: ${KAKAO_CLIENT_SECRET:default-kakao-id}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

oauth2:
  kakao:
    user-info-uri: ${KAKAO_USER_INFO}
  naver:
    user-info-uri: ${NAVER_USER_INFO}

jwt:
  access-token-secret: ${ACCESS_TOKEN}
  refresh-token-secret: ${REFRESH_TOKEN}

  access-token-expiration: ${EXPIRATION_TIME}
  refresh-token-expiration: ${EXPIRATION_DATE}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info

pinpoint:
  web:
    applicationMap:
      refreshInterval: 30000  # 30초로 폴링 간격 설정 (밀리초)
      cacheEnabled: true      # 캐싱 활성화
      cacheTtl: 60000        # 캐시 유지 시간 (60초)
    ui:
      autoRefresh: false     # 자동 새로고침 비활성화 (수동 제어)
    hbase:
      connectionTimeout: 3000  # HBase 연결 타임아웃 (3초)
      readTimeout: 5000       # HBase 읽기 타임아웃 (5초)

kanji:
  api:
    url: ${KANJI_API_URL:http://127.0.0.1:3000}